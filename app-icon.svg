<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2826"/>
      <stop offset="1" stop-color="#161514"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA5FF"/>
      <stop offset="1" stop-color="#5EC98C"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>
  <!-- Idle tracks: accounts that are low or at their limit. -->
  <g fill="none" stroke="#4A4640" stroke-width="4.5" stroke-linecap="round">
    <path d="M24 44 H44"/>
    <path d="M24 44 C33 44 34 32 44 32"/>
  </g>
  <circle cx="50" cy="44" r="3.5" fill="#F06868"/>
  <circle cx="50" cy="32" r="3.5" fill="#E2BE5C"/>
  <!-- The switched route to the account with quota left. -->
  <path d="M12 44 H24 C35 44 34 20 44 20" fill="none" stroke="url(#route)" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="50" cy="20" r="4.5" fill="#5EC98C"/>
</svg>
