[package]
name = "ai-hopper"
version = "0.1.0"
description = "Manage all your AI subscriptions and launch any CLI with the right account"
authors = ["AI Hopper contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "ai_hopper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
which = "6"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
toml = "0.8"
glob = "0.3"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
once_cell = "1"
log = "0.4"
same-file = "1"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
